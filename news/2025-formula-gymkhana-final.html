<section class="section section-surface"><div class="container blog-layout">
<div class="blog-main" id="post-main"><article class="post-article"><div class="post-content"><p>2025年11月、富士スピードウェイで行われたフォーミュラジムカーナの決勝ラウンド（全国大会）で、上智大学自動車部は**3位**に入りました。</p><p>予選ラウンドから積み上げてきたチームの力が、最後の舞台で形になりました。この結果が、翌2026シーズンの「今度こそ優勝」という目標につながっています。</p></div></article></div>
